services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: go-echo-huma
    restart: always
    ports:
      - ${PORT:-8000}:${PORT:-8000}
    environment:
      APP_ENV: production
      PORT:
      API_BASE_PATH:
      JWT_SECRET:
      TOKEN_EXPIRATION:
      REQ_PER_SEC_LIMIT:
      ENABLE_PROMETHEUS:
      LOG_LEVEL:
      MONGO_HOST:
      MONGO_PORT:
      MONGO_DB_NAME:
      MONGO_DB_USER:
      MONGO_DB_PASS:
      POSTGRES_HOST:
      POSTGRES_PORT:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASS:
      S3_ENDPOINT:
      S3_BUCKET:
      AWS_REGION:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      PETSTORE_URL:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
