services:
  api-server:
    extends:
      file: compose.yaml
      service: api-server
    build:
      target: dev
    image: go-echo-huma-dev
    volumes:
      - .:/app
    environment:
      APP_ENV: development
    depends_on:
      - mongo
      - petstore
    networks:
      - app-network

  mongo:
    image: mongo:8.0
    restart: always
    ports:
      - ${MONGO_PORT:-27017}:27017
    networks:
      - app-network
      - mongo-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
      MONGO_INITDB_USERNAME: ${MONGO_DB_USER}
      MONGO_INITDB_PASSWORD: ${MONGO_DB_PASS}
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - ${MONGO_EXPRESS_PORT:-8081}:8081
    networks:
      - mongo-network
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASS}
    depends_on:
      - mongo

  postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    networks:
      - app-network
      - postgres-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - postgres-data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:9
    restart: always
    ports:
      - ${PGADMIN_PORT:-5050}:80
    networks:
      - postgres-network
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  petstore:
    image: swaggerapi/petstore3:1.0.25
    restart: always
    ports:
      - 8080:8080
    networks:
      - app-network
      
  prometheus:
    image: prom/prometheus
    restart: always
    ports:
      - 9090:9090
    depends_on:
      - api-server
    networks:
      - app-network
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  mongo-data:
  postgres-data:
  pgadmin-data:

networks:
  app-network:
    name: app-network
    driver: bridge
  mongo-network:
    name: mongo-network
    driver: bridge
  postgres-network:
    name: postgres-network
    driver: bridge
